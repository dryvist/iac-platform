# IaC automation platform: Terrakube (OpenTofu management plane) + Semaphore UI
# (Ansible tier), one compose project on the iac-platform VM.
#
# Adapted from the upstream Terrakube reference compose with three deliberate
# divergences:
#   - no bundled traefik: the homelab's central Traefik fronts every service by
#     FQDN with the wildcard ACME cert (ingress rows live in tofu-proxmox
#     ingress.tf). This stack only publishes plain-HTTP host ports for Traefik
#     to back onto.
#   - no bundled minio: state/output/module storage is the existing RustFS
#     object store, reached ONLY by FQDN (S3 ingress row) — never an IP:port.
#   - no openldap: Dex delegates human authentication to OpenBao's native OIDC
#     provider; OpenBao identity groups are Terrakube's authorization source.
#
# Secrets are NOT in this file or compose/.env — they interpolate from the
# environment at deploy time, exported from OpenBao by
# `scripts/openbao-exec-env.sh` (see scripts/deploy.sh). Every ${VAR} with no
# default here is secret-sourced.
#
# The executor is deliberately unpublished: only the API reaches it, on the
# compose-internal network.

x-logging: &logging
  # journald, not the default json-file, for every service in this stack.
  #
  # Two reasons, and the first one is a live exposure: json-file has no size
  # bound by default, so a chatty or crash-looping container grows without
  # limit until it fills the boot disk. The second is that this is how run
  # output leaves the box — rsyslog reads the journal, so a journald-driven
  # container is collected by the existing syslog forwarder with no per-service
  # shipper. The estate's syslog role documents this driver as its assumption;
  # this is the file that makes the assumption true.
  driver: journald
  options:
    # Without this, journald's syslog identifier for every service here is
    # the container's short hash — indistinguishable from any other
    # container in a downstream search or alert, and different on every
    # recreate. {{.Name}} resolves to each service's own container_name.
    tag: "{{.Name}}"

x-api: &api_env
  # Tofu releases list served from a pinned static file in THIS repo (raw URL),
  # not api.github.com: GitHub started 400-ing the API's anonymous Java/Netty
  # fetch (2026-07-19, Zammad #17087 / issue #25), which NPEs the executor and
  # kills every plan at init. The file is GitHub releases-array shaped (the only
  # format the executor's parser accepts) and trimmed to recent stable releases.
  # STALENESS CONTRACT: when a workspace's tofu version pin moves past the
  # newest entry, regenerate compose/tofu-releases.json (see the file's PR /
  # issue #25 for the one-liner). Durable fix tracked in issue #25
  # (authenticated fetch via CustomReleaseGithubToken).
  CustomTofuReleasesUrl: https://raw.githubusercontent.com/dryvist/iac-platform/main/compose/tofu-releases.json
  ApiDataSourceType: POSTGRESQL
  DatasourceHostname: postgresql-service
  DatasourceDatabase: ${TK_POSTGRESQL_DATABASE_NAME}
  DatasourceUser: ${TK_POSTGRESQL_USERNAME}
  DatasourcePassword: ${TK_POSTGRESQL_PASSWORD}
  GroupValidationType: DEX
  UserValidationType: DEX
  AuthenticationValidationType: DEX
  TerrakubeHostname: terrakube-api.${DOMAIN}
  AzBuilderExecutorUrl: http://terrakube-executor:8090/api/v1/terraform-rs
  PatSecret: ${PAT_SECRET}
  InternalSecret: ${INTERNAL_SECRET}
  DexIssuerUri: https://terrakube-dex.${DOMAIN}/dex
  DexClientId: terrakube-app
  # Admin group forwarded from the OpenBao OIDC provider through Dex.
  # Composed, never written out: this must equal the group claim Dex's GitHub
  # connector emits (org-qualified "org:team-slug") and the terrakube_team
  # resource in tofu/terrakube. Deriving it from the same two variables the
  # connector uses is what keeps those three in step — a hand-written copy is
  # how they drifted before.
  TERRAKUBE_ADMIN_GROUP: ${DEX_GITHUB_ORG}:${DEX_GITHUB_TEAM}
  # Per-job JWTs let executors authenticate to OpenBao without a stored token.
  # The signing key pair is sourced from OpenBao through native compose secrets.
  DynamicCredentialId: ${TK_DYNAMIC_CREDENTIAL_KEY_ID}
  DynamicCredentialTtl: "90"
  DynamicCredentialPublicKeyPath: /run/secrets/terrakube_dynamic_credential_public_key
  DynamicCredentialPrivateKeyPath: /run/secrets/terrakube_dynamic_credential_private_key
  StorageType: AWS
  AwsStorageAccessKey: ${TK_OUTPUT_ACCESS_KEY}
  AwsStorageSecretKey: ${TK_OUTPUT_SECRET_KEY}
  AwsStorageBucketName: ${TK_OUTPUT_BUCKET_NAME}
  AwsStorageRegion: ${TK_OUTPUT_STORAGE_REGION}
  AwsEndpoint: ${TK_OUTPUT_ENDPOINT}
  AwsEnablePathStyle: "true"
  TerrakubeUiURL: https://terrakube.${DOMAIN}
  TerrakubeToolsRepository: https://github.com/terrakube-io/terrakube-extensions.git
  TerrakubeToolsBranch: main
  TerrakubeRedisHostname: redis-service
  TerrakubeRedisPort: 6379
  TerrakubeRedisPassword: ${TK_REDIS_PASSWORD}
  JAVA_TOOL_OPTIONS: -Xmx512m

x-executor: &executor_env
  TerrakubeEnableSecurity: "true"
  InternalSecret: ${INTERNAL_SECRET}
  TerraformStateType: AwsTerraformStateImpl
  AwsTerraformStateAccessKey: ${TK_OUTPUT_ACCESS_KEY}
  AwsTerraformStateSecretKey: ${TK_OUTPUT_SECRET_KEY}
  AwsTerraformStateBucketName: ${TK_OUTPUT_BUCKET_NAME}
  AwsTerraformStateRegion: ${TK_OUTPUT_BUCKET_REGION}
  AwsEndpoint: ${TK_OUTPUT_ENDPOINT}
  AwsEnablePathStyle: "true"
  TerraformOutputType: AwsTerraformOutputImpl
  AwsTerraformOutputAccessKey: ${TK_OUTPUT_ACCESS_KEY}
  AwsTerraformOutputSecretKey: ${TK_OUTPUT_SECRET_KEY}
  AwsTerraformOutputBucketName: ${TK_OUTPUT_BUCKET_NAME}
  AwsTerraformOutputRegion: ${TK_OUTPUT_BUCKET_REGION}
  AzBuilderApiUrl: https://terrakube-api.${DOMAIN}
  # tofuReleasesUrl derives from AzBuilderApiUrl, but terraformReleasesUrl has no
  # default (${CustomTerraformReleasesUrl}); the executor eagerly inits the
  # terraform downloader even for tofu-only workspaces, so an unset value NPEs
  # every job. HashiCorp-direct: no auth, no dex dependency.
  CustomTerraformReleasesUrl: https://releases.hashicorp.com/terraform/index.json
  ExecutorFlagBatch: "false"
  ExecutorFlagDisableAcknowledge: "false"
  TerrakubeToolsRepository: https://github.com/terrakube-io/terrakube-extensions.git
  TerrakubeToolsBranch: main
  TerrakubeRegistryDomain: terrakube-registry.${DOMAIN}
  TerrakubeApiUrl: https://terrakube-api.${DOMAIN}
  TerrakubeRedisHostname: redis-service
  TerrakubeRedisPort: 6379
  TerrakubeRedisPassword: ${TK_REDIS_PASSWORD}
  JAVA_TOOL_OPTIONS: -Xmx512m

x-registry: &registry_env
  AzBuilderRegistry: https://terrakube-registry.${DOMAIN}
  AzBuilderApiUrl: https://terrakube-api.${DOMAIN}
  AuthenticationValidationTypeRegistry: DEX
  TerrakubeEnableSecurity: "true"
  DexIssuerUri: https://terrakube-dex.${DOMAIN}/dex
  TerrakubeUiURL: https://terrakube.${DOMAIN}
  PatSecret: ${PAT_SECRET}
  InternalSecret: ${INTERNAL_SECRET}
  RegistryStorageType: AwsStorageImpl
  AwsStorageAccessKey: ${TK_OUTPUT_ACCESS_KEY}
  AwsStorageSecretKey: ${TK_OUTPUT_SECRET_KEY}
  AwsStorageBucketName: ${TK_OUTPUT_BUCKET_NAME}
  AwsStorageRegion: ${TK_OUTPUT_STORAGE_REGION}
  AwsEndpoint: ${TK_OUTPUT_ENDPOINT}
  AwsEnablePathStyle: "true"
  AppClientId: terrakube-app
  AppIssuerUri: https://terrakube-dex.${DOMAIN}/dex
  JAVA_TOOL_OPTIONS: -Xmx384m

x-ui: &ui_env
  REACT_APP_TERRAKUBE_API_URL: https://terrakube-api.${DOMAIN}/api/v1/
  REACT_APP_CLIENT_ID: terrakube-app
  REACT_APP_AUTHORITY: https://terrakube-dex.${DOMAIN}/dex
  REACT_APP_REDIRECT_URI: https://terrakube.${DOMAIN}
  REACT_APP_REGISTRY_URI: https://terrakube-registry.${DOMAIN}
  REACT_APP_SCOPE: email openid profile offline_access groups
  REACT_APP_TERRAKUBE_SEND_COOKIES: "false"

services:
  terrakube-api:
    logging: *logging
    image: azbuilder/api-server:${TK_VERSION}
    container_name: terrakube-api
    environment:
      <<: [*api_env]
    secrets:
      - terrakube_dynamic_credential_public_key
      - terrakube_dynamic_credential_private_key
    ports:
      - "${PORT_TERRAKUBE_API}:8080"
    # Paketo's memory-calculator reserves ~824M for fixed regions (metaspace +
    # code cache + thread stacks) before heap; a sub-824M limit crashes the JVM
    # at launch (exit 82). Give fixed regions + the -Xmx512m heap real room.
    mem_limit: 1536m
    restart: unless-stopped
    depends_on:
      postgresql-service:
        condition: service_healthy

  terrakube-ui:
    logging: *logging
    image: azbuilder/terrakube-ui:${TK_VERSION}
    container_name: terrakube-ui
    environment:
      <<: [*ui_env]
    # The React bundle reads window._env_ from /env-config.js at runtime; this
    # image ships none (so the SPA renders blank). deploy.sh generates it from
    # $DOMAIN — non-secret public URLs, so nothing sensitive is committed — and
    # ships it to the VM, mounted here. The x-ui env above documents the same
    # values (nginx does not inject them into the prebuilt static bundle).
    volumes:
      - /var/lib/platform/compose/ui/env-config.js:/usr/share/nginx/html/env-config.js:ro
    ports:
      - "${PORT_TERRAKUBE_UI}:8080"
    mem_limit: 64m
    restart: unless-stopped

  terrakube-executor:
    logging: *logging
    image: azbuilder/executor:${TK_VERSION}
    container_name: terrakube-executor
    environment:
      <<: [*executor_env]
    # No published ports: executor is compose-internal only (API dials
    # http://terrakube-executor:8090). Never front this service.
    # 1g crashed at launch (Paketo fixed regions ~824M + -Xmx512m heap > 1g).
    mem_limit: 1536m
    restart: unless-stopped

  terrakube-registry:
    logging: *logging
    image: azbuilder/open-registry:${TK_VERSION}
    container_name: terrakube-registry
    environment:
      <<: [*registry_env]
    ports:
      - "${PORT_TERRAKUBE_REGISTRY}:8075"
    # 512m < Paketo fixed regions (~824M) + -Xmx384m heap → launch crash.
    mem_limit: 1280m
    restart: unless-stopped

  terrakube-dex:
    logging: *logging
    image: ghcr.io/dexidp/dex:${TK_DEX_VERSION}
    container_name: terrakube-dex
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    environment:
      DOMAIN: ${DOMAIN}
      # Org and team are the single source for admin membership: the connector
      # template reads them, and TERRAKUBE_ADMIN_GROUP below is composed from
      # the same two values rather than repeating the org:team string.
      DEX_GITHUB_ORG: ${DEX_GITHUB_ORG}
      DEX_GITHUB_TEAM: ${DEX_GITHUB_TEAM}
      DEX_GITHUB_CLIENT_ID: ${DEX_GITHUB_CLIENT_ID}
      DEX_GITHUB_CLIENT_SECRET: ${DEX_GITHUB_CLIENT_SECRET}
    volumes:
      # Absolute VM path, not ./dex: bind-mount sources resolve on the remote
      # daemon (deploy is `docker --host ssh://`), so deploy.sh rsyncs this
      # non-secret file to the VM before `up`. The OpenBao OIDC client values
      # still inject from env at container runtime; this file carries no secret.
      - /var/lib/platform/compose/dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "${PORT_TERRAKUBE_DEX}:5556"
    mem_limit: 64m
    restart: unless-stopped

  redis-service:
    logging: *logging
    image: valkey/valkey:${TK_REDIS_VERSION}
    container_name: redis-service
    command:
      - valkey-server
      - --requirepass
      - ${TK_REDIS_PASSWORD}
      - --rename-command
      - FLUSHDB
      - ""
      - --rename-command
      - FLUSHALL
      - ""
      - --save
      - ""
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    mem_limit: 128m
    restart: unless-stopped

  postgresql-service:
    logging: *logging
    image: postgres:${TK_POSTGRESQL_VERSION}
    container_name: postgresql-service
    environment:
      POSTGRES_USER: ${TK_POSTGRESQL_USERNAME}
      POSTGRES_PASSWORD: ${TK_POSTGRESQL_PASSWORD}
      POSTGRES_DB: ${TK_POSTGRESQL_DATABASE_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
      # Consumed by initdb/01-semaphore.sh on first boot only.
      SEMAPHORE_DB_USER: semaphore
      SEMAPHORE_DB_PASS: ${SEMAPHORE_DB_PASS}
      SEMAPHORE_DB_NAME: semaphore
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      # Absolute VM path (see dex note): rsynced to the VM by deploy.sh so the
      # first-boot semaphore DB/user init script actually runs on the daemon.
      - /var/lib/platform/compose/postgres/initdb:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TK_POSTGRESQL_USERNAME} -d ${TK_POSTGRESQL_DATABASE_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Logical-backup sidecar: pg_dumpall during the node's power-on window (the
  # node is off overnight, so a classic nightly cron would never fire). The
  # dump lands on the VM disk, which the vzdump job then captures.
  postgres-backup:
    logging: *logging
    image: postgres:${TK_POSTGRESQL_VERSION}
    container_name: postgres-backup
    environment:
      PGHOST: postgresql-service
      PGUSER: ${TK_POSTGRESQL_USERNAME}
      PGPASSWORD: ${TK_POSTGRESQL_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if [ "$$(date +%H)" = "12" ] && [ ! -f /backups/.dumped-$$(date +%F) ]; then
            pg_dumpall > /backups/pg_dumpall-$$(date +%F).sql &&
            touch /backups/.dumped-$$(date +%F) &&
            ls -1t /backups/pg_dumpall-*.sql | tail -n +15 | xargs -r rm -f
          fi
          sleep 300
        done
    volumes:
      - /var/lib/platform/backups:/backups
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      postgresql-service:
        condition: service_healthy

  semaphore:
    logging: *logging
    image: semaphoreui/semaphore:${SEMAPHORE_VERSION}
    # Built on top of the pinned upstream image (build.args feeds it the same
    # SEMAPHORE_VERSION this compose file already pins, so a deploy never
    # tracks two versions) to add the tools scripts/run-ansible.sh needs
    # (curl, jq, ssh, git) — see compose/semaphore/Dockerfile.
    build:
      context: ..
      dockerfile: compose/semaphore/Dockerfile
      args:
        SEMAPHORE_VERSION: ${SEMAPHORE_VERSION}
    container_name: semaphore
    environment:
      SEMAPHORE_DB_DIALECT: postgres
      SEMAPHORE_DB_HOST: postgresql-service
      SEMAPHORE_DB_PORT: 5432
      SEMAPHORE_DB: semaphore
      SEMAPHORE_DB_USER: semaphore
      SEMAPHORE_DB_PASS: ${SEMAPHORE_DB_PASS}
      # Local admin stays as break-glass; SSO is the intended day-to-day login.
      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_NAME: Admin
      SEMAPHORE_ADMIN_EMAIL: ${SEMAPHORE_ADMIN_EMAIL}
      SEMAPHORE_ADMIN_PASSWORD: ${SEMAPHORE_ADMIN_PASSWORD}
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: ${SEMAPHORE_ACCESS_KEY_ENCRYPTION}
      SEMAPHORE_WEB_ROOT: https://semaphore.${DOMAIN}
      # The plane's own rail: Semaphore stops any task at 20 minutes, above
      # the playbooks' 10-minute soft budget and at their hard cap. A run that
      # needs longer is a defect to scope down, never a value to raise here.
      SEMAPHORE_MAX_TASK_DURATION_SEC: "1200"
      # Server-wide concurrency ceiling, spanning every project. Each project
      # below still declares its own max_parallel_tasks = 1 (tofu/semaphore),
      # which only bounds concurrency WITHIN that project; splitting into
      # several projects (tofu/semaphore) would otherwise let one task per
      # project run at once, unbounded by anything else. This is the actual
      # limit, and it is sized to the memory budget below, not to project
      # count: THIS VALUE AND mem_limit ARE ONE BUDGET, same relationship as
      # the mem_limit comment already documents for forks. Worst-case peak
      # per task (an "all"-scoped template at forks=12) is ~250 MiB parent +
      # 12 x 110 MiB workers =~ 1.53 GiB; raising this without raising
      # mem_limit trades a slow converge for OOM-killed workers on whichever
      # task loses the race, same failure mode a bare max_parallel_tasks
      # bump on one project already causes today. Default (unset) is 9999 —
      # effectively unbounded — so this MUST be set explicitly rather than
      # left to inherit a safe-looking default that is not actually safe.
      SEMAPHORE_MAX_PARALLEL_TASKS: "3"
      # Dispatches every task to the runner service below.
      SEMAPHORE_USE_REMOTE_RUNNER: "true"
      # Shared token the runner below presents to register itself.
      SEMAPHORE_RUNNER_REGISTRATION_TOKEN: ${semaphore_runner_registration_token:?}
      # Authelia OIDC login (Semaphore's own JSON-string provider config).
      # DOMAIN is already a plain env var here like every other hostname in
      # this file, so the provider_url needs no extra indirection.
      SEMAPHORE_OIDC_PROVIDERS: '{"authelia":{"display_name":"Sign in with Authelia","provider_url":"https://authelia.${DOMAIN}","client_id":"semaphore","client_secret":"${SEMAPHORE_OIDC_CLIENT_SECRET}","redirect_url":"https://semaphore.${DOMAIN}/api/auth/oidc/authelia/redirect","scopes":["openid","profile","email"],"username_claim":"preferred_username","name_claim":"name","email_claim":"email"}}'
      # Run credentials, inherited by every task process Semaphore spawns.
      #
      # WHAT BELONGS HERE, AND WHY THE LIST IS SHRINKING.
      # A bootstrap credential has to live somewhere the runner can read before
      # it can read anything else; everything reachable WITH that bootstrap
      # should be fetched at run time instead of parked here. The playbooks now
      # read their own Splunk, Splunkbase and object-storage credentials from
      # OpenBao (community.hashi_vault, using the token run-ansible.sh already
      # mints), so those four are gone from this file and from the project
      # environment deploy.sh writes.
      #
      # They are also deliberately NOT Semaphore Environment secrets. Two
      # independent reasons, and the second is the one that bites: the provider
      # persists a secret's value in OpenTofu state, AND for a bash-type
      # template Semaphore splices `secrets[]` in as POSITIONAL ARGUMENTS
      # between the script name and the declared arguments (v2.18.18,
      # services/tasks/LocalJob.go). Every template here is bash-shaped, so a
      # secret moved there would be passed to run-ansible.sh as an argument.
      #
      # BAO_ADDR plus an AppRole pair are what run-ansible.sh exchanges for an
      # ephemeral signed SSH certificate and for the run's OpenBao token. Empty
      # defaults so the stack still starts before they are wired; deploy.sh
      # reports the gap explicitly rather than letting runs fail later with an
      # SSH error.
      BAO_ADDR: ${BAO_ADDR:-}
      # The execution plane's own identity: its own policy, and certificates
      # signed under principal `semaphore` rather than `ansible`, so a host's
      # sshd log distinguishes an unattended run from a human's laptop run.
      OPENBAO_APPROLE_SEMAPHORE_ROLE_ID: ${OPENBAO_APPROLE_SEMAPHORE_ROLE_ID:-}
      OPENBAO_APPROLE_SEMAPHORE_SECRET_ID: ${OPENBAO_APPROLE_SEMAPHORE_SECRET_ID:-}
      # Repository checkouts run with a CURATED environment, not this one.
      # Semaphore builds every subprocess environment from PATH plus exactly
      # the names listed here (v2.18.18, db_lib/LocalApp.go getEnvironmentVars,
      # used by db_lib/CmdGitClient.go for clone, pull and checkout), so the
      # git credential helper sees none of the three variables above unless
      # they are named. Task processes get them from the Semaphore project
      # environment instead, which is why playbooks worked while clones did
      # not. Forwarding changes no trust boundary: the same three values are
      # already in this file and already reach every task.
      #
      # JSON array, and only a JSON array: the config loader json.Unmarshals
      # this value and PANICS at startup on anything else
      # (util/config.go setConfigValue).
      SEMAPHORE_FORWARDED_ENV_VARS: >-
        ["BAO_ADDR", "OPENBAO_APPROLE_SEMAPHORE_ROLE_ID",
        "OPENBAO_APPROLE_SEMAPHORE_SECRET_ID"]
      # Nothing else. Every other value a run needs — the ansible pair the
      # runners fall back to, the reconcile pair, the telemetry callback's
      # token, the Nautobot pair — is read from OpenBao at run time: the
      # wrapper exports the run-environment documents before any playbook
      # starts, and the one non-Ansible template wraps itself the same way.
      # A value listed here would be a second copy with its own rotation.
    volumes:
      - semaphore_data:/var/lib/semaphore
    ports:
      - "${PORT_SEMAPHORE}:3000"
    # No task forking here anymore; sized like the other small services below
    # (terrakube-executor 1536m, postgresql-service 512m).
    mem_limit: 1024m
    restart: unless-stopped
    depends_on:
      postgresql-service:
        condition: service_healthy

  # Runs every task; reuses the semaphore image above via a command override.
  semaphore-runner:
    logging: *logging
    image: semaphoreui/semaphore:${SEMAPHORE_VERSION}
    container_name: semaphore-runner
    command: ["semaphore", "runner", "start", "--no-config", "--register"]
    environment:
      # In-network address of the semaphore server (compose service name,
      # container port), not the ingress vhost.
      SEMAPHORE_WEB_ROOT: http://semaphore:3000
      # Shared token this runner presents to register itself.
      SEMAPHORE_RUNNER_REGISTRATION_TOKEN: ${semaphore_runner_registration_token:?}
      # Persists the issued token so a restart keeps the same runner identity.
      SEMAPHORE_RUNNER_TOKEN_FILE: /var/lib/semaphore/runner_token.txt
      # Runner registers Active=false by default; force it enabled so tasks route to it.
      SEMAPHORE_RUNNER_ENABLED: "true"
      # Names the runner record instead of leaving it blank.
      SEMAPHORE_RUNNER_NAME: semaphore-runner
      # Runner-side concurrency cap (separate key from the server's, above).
      SEMAPHORE_RUNNER_MAX_PARALLEL_TASKS: "3"
      # run-ansible.sh's OpenBao identity, same values as the semaphore service.
      BAO_ADDR: ${BAO_ADDR:-}
      OPENBAO_APPROLE_SEMAPHORE_ROLE_ID: ${OPENBAO_APPROLE_SEMAPHORE_ROLE_ID:-}
      OPENBAO_APPROLE_SEMAPHORE_SECRET_ID: ${OPENBAO_APPROLE_SEMAPHORE_SECRET_ID:-}
      # Curated git-clone env allow-list; same three values as above.
      SEMAPHORE_FORWARDED_ENV_VARS: >-
        ["BAO_ADDR", "OPENBAO_APPROLE_SEMAPHORE_ROLE_ID",
        "OPENBAO_APPROLE_SEMAPHORE_SECRET_ID"]
    volumes:
      - semaphore_runner_data:/var/lib/semaphore
    # Ansible forks run here now: sized for K=3 (SEMAPHORE_RUNNER_MAX_PARALLEL_TASKS)
    # at ~1.53 GiB worst-case per task (250 MiB parent + 12x110 MiB workers).
    mem_limit: 6144m
    restart: unless-stopped
    depends_on:
      semaphore:
        condition: service_started

volumes:
  redis_data:
  postgresql_data:
  semaphore_data:
  semaphore_runner_data:

# Docker Compose materializes these environment-sourced values as read-only
# files under /run/secrets. The values are injected from OpenBao for deploy and
# never live in compose/.env or a repository file. The private key must be
# unencrypted PKCS#8 as required by Terrakube's dynamic credential service.
secrets:
  terrakube_dynamic_credential_public_key:
    environment: TK_DYNAMIC_CREDENTIAL_PUBLIC_KEY
  terrakube_dynamic_credential_private_key:
    environment: TK_DYNAMIC_CREDENTIAL_PRIVATE_KEY
