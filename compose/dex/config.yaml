# Dex for Terrakube: GitHub + Authelia connectors (no local passwords or LDAP).
# Secrets AND the real domain arrive as env vars from OpenBao at deploy time,
# so no real hostname is ever committed. Two templating passes run: the dex
# image renders the whole file with gomplate at container start (Go-template
# .Env lookups), then dex applies its own $VAR expansion to the connector config
# block only. Domain refs therefore use gomplate .Env in top-level fields; the
# connector's secret values stay $VAR so Dex expands them post-parse. NB
# gomplate renders
# comments too, so this note avoids literal template braces.
issuer: https://terrakube-dex.{{ .Env.DOMAIN }}/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556
  # Replaces the upstream reference's Traefik CORS middleware: the UI origin
  # must be allowed to hit dex from the browser.
  allowedOrigins:
    - 'https://terrakube.{{ .Env.DOMAIN }}'

oauth2:
  responseTypes: ["code"]

expiry:
  # Generous idToken lifetime: "login once per machine" ergonomics. Re-login
  # after expiry is a single browser redirect (already GitHub-authenticated).
  idTokens: 720h

staticClients:
  - id: terrakube-app
    name: Terrakube
    public: true
    redirectURIs:
      - https://terrakube.{{ .Env.DOMAIN }}
      # tofu/terraform login device flow callbacks (CLI-driven workflow).
      - http://localhost:10000/login
      - http://localhost:10001/login

connectors:
  # GitHub, because the group claim it emits is the one the rest of the stack
  # is built around: TERRAKUBE_ADMIN_GROUP in the compose env and the
  # terrakube_team resource in tofu/terrakube are both the org-qualified
  # "org:team-slug" that this connector forwards. An OIDC connector emits a
  # bare group instead, so swapping connectors alone silently breaks admin
  # membership while login itself still appears to work.
  #
  # Org and team are NOT written here. They come from the same two variables
  # the compose file composes TERRAKUBE_ADMIN_GROUP from, so the group this
  # connector grants and the group Terrakube honours cannot drift apart.
  # gomplate renders this file at container start, so .Env works anywhere;
  # only the secrets stay $VAR for dex to expand after parsing, keeping them
  # out of the rendered file.
  - type: github
    id: github
    name: GitHub
    config:
      clientID: $DEX_GITHUB_CLIENT_ID
      clientSecret: $DEX_GITHUB_CLIENT_SECRET
      redirectURI: https://terrakube-dex.{{ .Env.DOMAIN }}/dex/callback
      orgs:
        - name: {{ .Env.DEX_GITHUB_ORG }}
          teams:
            - {{ .Env.DEX_GITHUB_TEAM }}
      teamNameField: slug
      loadAllGroups: false
  # Second, additive login path: the operator chose to keep GitHub AND gain
  # Authelia rather than swap, so a mis-cut Authelia connector can never lock
  # anyone out. NOT a drop-in replacement for the GitHub connector above: the
  # GitHub connector forwards an org-qualified "org:team-slug" group, which is
  # what TERRAKUBE_ADMIN_GROUP (compose) and the terrakube_team resource
  # (tofu/terrakube) both expect. An OIDC connector forwards a bare group
  # instead (see the #30 fix that reverted an earlier OpenBao-connector swap
  # for exactly this mismatch) — so a user authenticating only via Authelia
  # will log in but will not match TERRAKUBE_ADMIN_GROUP unless Authelia is
  # configured to emit that same org-qualified group name. Fixing that shape
  # mismatch is out of scope here; this connector only adds the login path.
  - type: oidc
    id: authelia
    name: Authelia
    config:
      issuer: https://authelia.{{ .Env.DOMAIN }}
      clientID: $DEX_AUTHELIA_CLIENT_ID
      clientSecret: $DEX_AUTHELIA_CLIENT_SECRET
      redirectURI: https://terrakube-dex.{{ .Env.DOMAIN }}/dex/callback
      scopes: [openid, profile, email, groups]
      getUserInfo: true
      insecureSkipEmailVerified: true
      insecureEnableGroups: true
      allowedGroups: [terrakube-admins]
